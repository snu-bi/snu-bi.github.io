# Awards and Achievements

- title: RoboCup@Home 2023 - DSPL & OPL Winner
  year: 2023
  event: RoboCup@Home 2023
  location: Bordeaux, France
  category: competition
  description: >
    Team Tidyboy (SNU & Pusan National University) won both the Domestic Standard Platform League (DSPL)
    and Open Platform League (OPL) at RoboCup@Home 2023, competing against 2,500 participants from 45 countries.
  image: images/robocup2023.jpg
  links:
    - text: SNU News
      url: https://en.snu.ac.kr/snunow/snu_media/news?md=v&bbsidx=142740
    - text: RoboCup@Home
      url: https://athome.robocup.org/awards/

